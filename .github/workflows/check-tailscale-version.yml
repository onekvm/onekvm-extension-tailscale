name: Check Tailscale release

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tailscale-version-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      update: ${{ steps.release.outputs.update }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check the upstream release through GitHub API
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/tailscale/tailscale/releases/latest --jq '.tag_name' | sed 's/^v//')"
          content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/oe-recipes/recipes-connectivity/tailscale/tailscale_1.94.2.bbappend?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
          current="$(printf '%s\n' "$content" | sed -n 's/^PV = "\([^"]*\)"/\1/p')"
          test -n "$current"
          echo "Tailscale: $current -> $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$latest" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the extension
        uses: actions/checkout@v4

      - name: Update the pinned release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAILSCALE_VERSION: ${{ needs.check.outputs.version }}
        run: python3 scripts/check-tailscale-version.py --update

      - name: Open a pull request for a new release
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/tailscale-version
          delete-branch: true
          commit-message: "build(tailscale): update to ${{ needs.check.outputs.version }}"
          title: "build(tailscale): update to ${{ needs.check.outputs.version }}"
          body: |
            This pull request was opened by the daily Tailscale release check.

            It updates the pinned Tailscale release, source revision, extension package version, and runtime dependency together.

            Please run the normal OpenEmbedded update and package validation before merging. If the upstream release changed Go modules or license files, regenerate the checked metadata in `oe-recipes/recipes-connectivity/tailscale/` as part of this pull request.
